<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WGU C165 - Integrated Physical Sciences Flashcards</title>
<style>
  :root{
    --bg:#0f172a; --surface:#1e293b; --surface2:#334155; --border:#475569;
    --text:#f1f5f9; --muted:#94a3b8; --accent:#38bdf8; --accent2:#818cf8;
    --green:#4ade80; --yellow:#facc15; --red:#f87171;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .top{
    position:sticky;top:0;z-index:10;
    background:rgba(15,23,42,0.9);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:0.75rem 1rem;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem
  }
  .brand{font-weight:800;font-size:1.15rem;letter-spacing:-0.02em}
  .brand span{color:var(--accent)}
  .stats{display:flex;gap:0.75rem;font-size:0.85rem;color:var(--muted)}
  .stats b{color:var(--text)}
  .container{max-width:1100px;margin:0 auto;padding:1rem;display:grid;grid-template-columns:260px 1fr;gap:1rem}
  @media(max-width:900px){.container{grid-template-columns:1fr}.sidebar{order:2}}
  .sidebar{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.75rem;
    height:fit-content;position:sticky;top:65px
  }
  .sidebar h3{font-size:0.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin:0.75rem 0 0.5rem}
  .sidebar h3:first-child{margin-top:0}
  .chip{
    display:flex;justify-content:space-between;align-items:center;
    width:100%;padding:0.55rem 0.75rem;border-radius:8px;border:1px solid transparent;
    background:transparent;color:var(--text);cursor:pointer;margin-bottom:0.25rem;font-size:0.9rem;text-align:left;transition:.15s
  }
  .chip:hover{background:var(--surface2)}
  .chip.active{background:var(--accent);color:#0f172a;font-weight:600;border-color:var(--accent)}
  .chip small{opacity:0.7;font-size:0.75rem}
  .search{width:100%;padding:0.6rem 0.75rem;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-bottom:0.75rem}
  .main{display:flex;flex-direction:column;gap:1rem}
  .card-wrap{perspective:1000px;display:flex;justify-content:center}
  .card{
    width:100%;max-width:680px;min-height:380px;position:relative;transform-style:preserve-3d;transition:transform 0.5s;cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:1.5rem;display:flex;flex-direction:column;backface-visibility:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.4)
  }
  .face.back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--surface),#1e1b4b);border-color:var(--accent2)}
  .face .label{font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:0.75rem;display:flex;justify-content:space-between}
  .face .label span:last-child{padding:2px 8px;border-radius:20px;background:var(--surface2);font-size:0.7rem}
  .face .content{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.35rem;line-height:1.4;font-weight:600}
  .face.back .content{font-size:1.05rem;font-weight:400;color:var(--text);text-align:left}
  .face .hint{font-size:0.75rem;color:var(--muted);text-align:center;margin-top:1rem}
  .controls{display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap}
  .btn{
    padding:0.6rem 1rem;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);
    cursor:pointer;font-size:0.9rem;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:0.4rem
  }
  .btn:hover{background:var(--surface2)}
  .btn.primary{background:var(--accent);color:#0f172a;border-color:var(--accent);font-weight:700}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn.green{background:var(--green);color:#0f172a;border-color:var(--green)}
  .btn.red{background:transparent;color:var(--red);border-color:rgba(248,113,113,0.3)}
  .btn.red.active{background:rgba(248,113,113,0.15)}
  .progress{height:8px;background:var(--surface2);border-radius:10px;overflow:hidden;display:flex}
  .progress .p-known{background:var(--green);transition:.3s}
  .progress .p-unknown{background:var(--red);transition:.3s}
  .kbd{font-size:0.7rem;color:var(--muted);text-align:center;margin-top:0.25rem}
  .list-toggle{font-size:0.8rem;color:var(--muted);cursor:pointer;text-align:right}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0.75rem}
  .mini-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.75rem;cursor:pointer;transition:.15s}
  .mini-card:hover{border-color:var(--accent)}
  .mini-card .t{font-weight:600;font-size:0.9rem;margin-bottom:0.25rem}
  .mini-card .d{font-size:0.8rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mini-card.known{opacity:0.5;border-color:var(--green)}
  .empty{text-align:center;padding:3rem;color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <div class="brand">WGU <span>C165</span> • Integrated Physical Sciences</div>
  <div class="stats">
    <span><b id="statTotal">0</b> cards</span>
    <span><b id="statKnown" style="color:var(--green)">0</b> known</span>
    <span><b id="statLeft">0</b> left</span>
  </div>
</div>

<div class="container">
  <div class="sidebar">
    <input id="search" class="search" placeholder="Search term...">
    <h3>Mode</h3>
    <button class="chip active" data-mode="study">📚 Study Mode</button>
    <button class="chip" data-mode="quiz">🧠 Quiz Mode (MC)</button>
    <button class="chip" data-mode="list">📋 List View</button>

    <h3>Chapters</h3>
    <div id="chapterList"></div>

    <h3>Actions</h3>
    <button class="chip" id="shuffleBtn">🔀 Shuffle</button>
    <button class="chip" id="resetBtn">↺ Reset Progress</button>
    <div class="kbd" style="margin-top:1rem;text-align:left;line-height:1.6">
      <b>Shortcuts:</b><br>
      Space = flip<br>
      ← → = prev/next<br>
      K = mark known<br>
      U = unknown<br>
      S = shuffle
    </div>
  </div>

  <div class="main">
    <div class="progress" id="progressBar">
      <div class="p-known" id="pKnown" style="width:0%"></div>
      <div class="p-unknown" id="pUnknown" style="width:0%"></div>
    </div>

    <div id="studyView">
      <div class="card-wrap">
        <div class="card" id="flashCard">
          <div class="face front">
            <div class="label"><span id="cardChapter">Ch 1</span><span id="cardCount">1 / 100</span></div>
            <div class="content" id="cardTerm">Loading...</div>
            <div class="hint">Click or press Space to flip</div>
          </div>
          <div class="face back">
            <div class="label"><span>Definition</span><span id="cardTermSmall"></span></div>
            <div class="content" id="cardDef"></div>
            <div class="hint">Click to flip back</div>
          </div>
        </div>
      </div>

      <div class="controls" style="margin-top:1rem">
        <button class="btn" id="prevBtn">← Prev</button>
        <button class="btn primary" id="flipBtn">Flip (Space)</button>
        <button class="btn" id="nextBtn">Next →</button>
      </div>

      <div class="controls">
        <button class="btn red" id="unknownBtn">❌ Don't know (U)</button>
        <button class="btn green" id="knownBtn">✅ Know (K)</button>
      </div>

      <div id="quizOptions" class="controls" style="margin-top:0.5rem;display:none;flex-direction:column;max-width:680px;margin-inline:auto;width:100%"></div>
    </div>

    <div id="listView" style="display:none">
      <div class="grid" id="listGrid"></div>
    </div>
  </div>
</div>

<script>
const chapters = [
  {id:'all', name:'Whole Book - All Chapters'},
  {id:'ch1', name:'Ch 1: Scientific Method & Measurement'},
  {id:'ch2', name:'Ch 2: Matter & Atomic Structure'},
  {id:'ch3', name:'Ch 3: Chemical Bonds & Reactions'},
  {id:'ch4', name:'Ch 4: Motion & Forces'},
  {id:'ch5', name:'Ch 5: Energy & Thermodynamics'},
  {id:'ch6', name:'Ch 6: Waves, Sound & Light'},
  {id:'ch7', name:'Ch 7: Electricity & Magnetism'},
  {id:'ch8', name:'Ch 8: Rocks, Minerals & Plate Tectonics'},
  {id:'ch9', name:'Ch 9: Weather, Climate & Earth Systems'},
  {id:'ch10', name:'Ch 10: Astronomy & Space'},
];

const flashcards = [
  // Ch1
  {id:1, chapter:'ch1', term:'Scientific Method', definition:'Systematic process: observation, question, hypothesis, experiment, analysis, conclusion. Used to objectively test ideas and build knowledge.', example:'Testing if fertilizer affects plant growth'},
  {id:2, chapter:'ch1', term:'Hypothesis', definition:'Testable, falsifiable prediction that explains observations. Must be testable via experiment. Format: If...then...because.', example:'If plants get more light, then they grow taller because photosynthesis increases.'},
  {id:3, chapter:'ch1', term:'Theory vs Law', definition:'Theory = well-tested explanation of WHY (ex: atomic theory). Law = description of WHAT happens, often math equation (ex: Newton\'s law). Theories don\'t become laws.', example:''},
  {id:4, chapter:'ch1', term:'Independent vs Dependent Variable', definition:'Independent = you change it (X-axis). Dependent = you measure it (Y-axis), responds to independent. Control stays constant.', example:'Independent: light hours, Dependent: plant height'},
  {id:5, chapter:'ch1', term:'Accuracy vs Precision', definition:'Accuracy = how close to true value. Precision = how repeatable/consistent. You can be precise but not accurate.', example:'Dartboard: accurate = near bullseye, precise = darts clustered'},
  {id:6, chapter:'ch1', term:'SI Units & Significant Figures', definition:'International System: meter, kg, second, Kelvin, mole, ampere, candela. Sig figs = meaningful digits reflecting measurement precision.', example:'0.0045 has 2 sig figs'},
  {id:7, chapter:'ch1', term:'Model in Science', definition:'Representation to explain or predict. Physical, conceptual, or mathematical. All models have limitations.', example:'Bohr model of atom, globe as Earth model'},
  {id:8, chapter:'ch1', term:'Control Group', definition:'Group not exposed to independent variable, used for comparison to show effect is due to variable, not other factors.', example:'Plants with no fertilizer as control'},

  // Ch2
  {id:9, chapter:'ch2', term:'Matter & States', definition:'Anything with mass and volume. 4 states: solid (fixed shape), liquid (fixed volume), gas (fills container), plasma (ionized gas).', example:'Ice->water->steam'},
  {id:10, chapter:'ch2', term:'Atom Structure', definition:'Smallest unit of element: nucleus (protons+, neutrons) + electrons- in cloud. Most mass in nucleus, most volume is empty space.', example:'Hydrogen: 1p, 0n, 1e'},
  {id:11, chapter:'ch2', term:'Atomic Number vs Mass Number', definition:'Atomic number = # protons = defines element. Mass number = protons + neutrons. Isotopes same atomic # different neutrons.', example:'C-12: 6p+6n, C-14: 6p+8n'},
  {id:12, chapter:'ch2', term:'Periodic Table Organization', definition:'Organized by atomic number. Periods = rows (energy levels), Groups = columns (same valence electrons, similar properties).', example:'Group 1 = alkali metals, Group 18 = noble gases'},
  {id:13, chapter:'ch2', term:'Ions vs Isotopes', definition:'Ion = atom gains/loses electrons, becomes charged (cation + loses e-, anion - gains). Isotope = different neutrons, neutral but different mass.', example:'Na -> Na+ + e-, Cl + e- -> Cl-'},
  {id:14, chapter:'ch2', term:'Metals, Nonmetals, Metalloids', definition:'Metals: left side, shiny, conductive, malleable. Nonmetals: right side, dull, insulator. Metalloids: borderline, semiconductors.', example:'Si metalloid for chips'},
  {id:15, chapter:'ch2', term:'Element vs Compound vs Mixture', definition:'Element: one type atom (O2). Compound: 2+ elements chemically bonded (H2O). Mixture: physically combined, can separate (salt water).', example:''},
  {id:16, chapter:'ch2', term:'Law of Conservation of Matter', definition:'Matter not created/destroyed in chemical reactions. Mass of reactants = mass of products. Must balance equations.', example:'2H2 + O2 -> 2H2O mass same'},

  // Ch3
  {id:17, chapter:'ch3', term:'Ionic Bond', definition:'Electron transfer from metal to nonmetal, opposites attract. Forms crystal lattice, high mp, conductive when dissolved.', example:'NaCl: Na gives e- to Cl'},
  {id:18, chapter:'ch3', term:'Covalent Bond', definition:'Sharing electrons between nonmetals. Molecular, lower mp. Single =1 pair, double=2, triple=3. Polar = unequal sharing.', example:'H2O: O shares with 2 H, polar'},
  {id:19, chapter:'ch3', term:'Chemical Reaction & Balancing', definition:'Rearrangement of atoms to form new substances. Must balance atoms. Types: synthesis, decomposition, single/double replacement, combustion.', example:'CH4 + 2O2 -> CO2 + 2H2O'},
  {id:20, chapter:'ch3', term:'Acid vs Base & pH', definition:'Acid: donates H+, pH <7, sour, reacts with metal. Base: accepts H+ or OH-, pH >7, bitter, slippery. pH scale 0-14 logarithmic.', example:'Stomach acid pH ~2, bleach pH 13'},
  {id:21, chapter:'ch3', term:'Solution, Solute, Solvent', definition:'Solution = homogeneous mixture. Solute dissolved, solvent does dissolving. Concentrated = lots solute. Dilute = little. Molarity = moles/L.', example:'Salt water: salt solute, water solvent'},
  {id:22, chapter:'ch3', term:'Law of Conservation of Energy in Reactions', definition:'Exothermic = releases energy (feels hot, products lower energy). Endothermic = absorbs (feels cold, needs energy).', example:'Combustion exothermic, ice melting endothermic'},
  {id:23, chapter:'ch3', term:'Mixture Separation vs Chemical Change', definition:'Mixture: physical separation (filter, distillation). Chemical: new substances formed, evidence: color change, gas, precipitate, temp change.', example:''},
  {id:24, chapter:'ch3', term:'Valence Electrons & Octet Rule', definition:'Outer shell electrons determine bonding. Atoms seek 8 valence e- (octet) for stability, via gaining/losing/sharing.', example:'Na has 1 valence, wants to lose, Cl has 7 wants 1'},

  // Ch4
  {id:25, chapter:'ch4', term:'Speed vs Velocity vs Acceleration', definition:'Speed = distance/time scalar. Velocity = speed + direction vector. Acceleration = change in velocity/time (speed or direction change).', example:'Car accelerating 0-60 mph'},
  {id:26, chapter:'ch4', term:'Newton\'s First Law - Inertia', definition:'Object at rest stays at rest, in motion stays in motion unless net force. Inertia = resistance to change, proportional to mass.', example:'Seatbelt stops you when car stops'},
  {id:27, chapter:'ch4', term:'Newton\'s Second Law - F=ma', definition:'Force = mass * acceleration. More force or less mass = more acceleration. Net force not 0 causes acceleration.', example:'Push empty cart vs full cart'},
  {id:28, chapter:'ch4', term:'Newton\'s Third Law - Action/Reaction', definition:'Every action has equal opposite reaction. Forces on DIFFERENT objects. Rocket pushes gas down, gas pushes rocket up.', example:'Jump: you push Earth down, Earth pushes you up'},
  {id:29, chapter:'ch4', term:'Gravity & Weight vs Mass', definition:'Gravity: attraction between masses F=Gm1m2/r^2. Mass = amount matter (kg, constant). Weight = force gravity on mass (N, changes with planet).', example:'Mass 10kg everywhere, weight 98N on Earth, 16N on Moon'},
  {id:30, chapter:'ch4', term:'Friction & Air Resistance', definition:'Friction opposes motion: static > kinetic. Factors: surfaces, normal force. Air resistance increases with speed/surface area.', example:'Rougher surface more friction'},
  {id:31, chapter:'ch4', term:'Free Fall & Projectile Motion', definition:'Free fall: only gravity, g=9.8 m/s2 down. Projectile: horizontal constant velocity + vertical accelerated, path = parabola, independent.', example:'Dropped and thrown balls hit ground same time if same height'},
  {id:32, chapter:'ch4', term:'Momentum', definition:'p = mass * velocity. Inertia in motion. Conservation: total momentum before = after collision if no external force.', example:'Truck has more momentum than bike same speed'},

  // Ch5
  {id:33, chapter:'ch5', term:'Work & Power', definition:'Work = force * distance * cosθ, only when force causes displacement. Unit Joules. Power = work/time, rate, Watts = J/s.', example:'Lifting weights = work, holding them = no work physics'},
  {id:34, chapter:'ch5', term:'Kinetic vs Potential Energy', definition:'KE = energy of motion = 1/2mv^2. PE = stored due to position: gravitational mgh, elastic spring, chemical. Total mechanical conserved if no friction.', example:'Roller coaster: top PE, bottom KE'},
  {id:35, chapter:'ch5', term:'Conservation of Energy', definition:'Energy cannot create/destroy, transforms. Total system constant. With friction, mechanical becomes thermal (heat).', example:'Pendulum slows friction -> heat'},
  {id:36, chapter:'ch5', term:'Thermodynamics Laws', definition:'0th: equilibrium. 1st: energy conserved ΔU=Q-W. 2nd: entropy increases, heat flows hot->cold. 3rd: absolute zero unreachable.', example:'Ice melts spontaneously increases entropy'},
  {id:37, chapter:'ch5', term:'Heat Transfer - Conduction Convection Radiation', definition:'Conduction: direct contact (metal spoon). Convection: fluid movement (boiling water). Radiation: EM waves no medium (sun).', example:''},
  {id:38, chapter:'ch5', term:'Temperature vs Heat', definition:'Temperature = average KE of particles (K, C). Heat = total energy transferred due to temp difference (Joules).', example:'Lake vs cup: lake lower temp but more heat'},
  {id:39, chapter:'ch5', term:'Specific Heat Capacity', definition:'Energy needed to raise 1kg by 1°C. Water high (4186 J/kgC) moderates climate. Q=mcΔT.', example:'Sand heats faster than water'},
  {id:40, chapter:'ch5', term:'States & Phase Changes', definition:'Melting/freezing, vaporization/condensation, sublimation/deposition. Latent heat needed to change state, temp constant during change.', example:'Boiling water stays 100C until vaporized'},

  // Ch6
  {id:41, chapter:'ch6', term:'Wave Properties', definition:'Wave transfers energy not matter. Transverse: perp (light), longitudinal: parallel (sound). Key: wavelength λ, frequency f, amplitude, speed v=fλ.', example:'Ocean waves'},
  {id:42, chapter:'ch6', term:'Sound', definition:'Longitudinal mechanical wave needs medium, speed ~343 m/s air, faster in water/solid. Pitch = frequency, loudness = amplitude, Doppler shift.', example:'Siren pitch higher approaching'},
  {id:43, chapter:'ch6', term:'Electromagnetic Spectrum', definition:'All EM waves light speed: radio < microwave < IR < visible < UV < X-ray < gamma. Lower freq = lower energy. Visible ~400-700nm.', example:'Red ~700nm low energy, violet 400nm high'},
  {id:44, chapter:'ch6', term:'Reflection, Refraction, Diffraction', definition:'Reflection: bounce law angle in=out. Refraction: bends due to speed change n=c/v (lens). Diffraction: spreads through opening, more for longer λ.', example:'Straw looks bent in water = refraction'},
  {id:45, chapter:'ch6', term:'Interference & Resonance', definition:'Constructive: waves add brighter/louder. Destructive: cancel dark/quiet. Resonance: large amplitude when driven at natural frequency.', example:'Two speakers interference, bridge Tacoma'},
  {id:46, chapter:'ch6', term:'Color & Light', definition:'White = all colors. Object color = reflected. Pigment subtractive (RYB), light additive (RGB). Black absorbs, white reflects.', example:'Blue shirt reflects blue, absorbs rest'},
  {id:47, chapter:'ch6', term:'Lenses & Mirrors', definition:'Concave = converges, magnifies. Convex = diverges, widens view. Focal point. Real image inverted, virtual upright.', example:'Magnifying glass convex, car side mirrors convex'},
  {id:48, chapter:'ch6', term:'Inverse Square Law', definition:'Intensity ~1/d^2. Doubling distance = 1/4 intensity. Applies to light, sound, gravity, radiation.', example:'Move twice far from bulb, 1/4 brightness'},

  // Ch7
  {id:49, chapter:'ch7', term:'Electric Charge & Coulomb\'s Law', definition:'Charge: positive proton, negative electron, same repel opposite attract. Coulomb: F=kq1q2/r^2 similar gravity but stronger.', example:'Static cling'},
  {id:50, chapter:'ch7', term:'Current, Voltage, Resistance & Ohm\'s Law', definition:'Current I = flow charge (Amps). Voltage V = push/potential difference (Volts). Resistance R = opposition (Ohms). Ohm: V=IR.', example:'Battery voltage pushes current through resistor'},
  {id:51, chapter:'ch7', term:'Series vs Parallel Circuits', definition:'Series: one path, current same, voltage divides, if one fails all fail. Parallel: multiple paths, voltage same, current divides, independent.', example:'Christmas lights old series vs new parallel'},
  {id:52, chapter:'ch7', term:'Power in Electricity', definition:'P=VI=I^2R=V^2/R Watts. Energy = power*time kWh billed. Higher voltage less loss for transmission.', example:'100W bulb uses 0.1kWh per hour'},
  {id:53, chapter:'ch7', term:'Magnet & Magnetic Field', definition:'Magnet has N/S, like poles repel opposite attract. Field lines N->S. Earth is magnet. Magnetic domains align. Uncuttable.', example:'Compass needle aligns with Earth field'},
  {id:54, chapter:'ch7', term:'Electromagnetism & Faraday', definition:'Current makes magnetism (electromagnet). Moving magnet makes current (induction) Faraday\'s law. Generator vs motor opposite.', example:'Generator: spin magnet -> electricity'},
  {id:55, chapter:'ch7', term:'AC vs DC', definition:'DC = one direction (battery). AC = alternates (house 60Hz US). AC easier transform voltage for long distance.', example:'Phone charger AC->DC'},

  // Ch8
  {id:56, chapter:'ch8', term:'Mineral vs Rock', definition:'Mineral = naturally inorganic solid with definite crystal structure/composition (ex: quartz SiO2). Rock = aggregate of 1+ minerals.', example:'Granite = quartz + feldspar + mica'},
  {id:57, chapter:'ch8', term:'Igneous Rocks', definition:'From cooling magma/lava. Intrusive slow cools large crystals (granite). Extrusive fast cools small/glassy (basalt, obsidian). Felsic light, mafic dark.', example:'Pumice floats, has gas bubbles'},
  {id:58, chapter:'ch8', term:'Sedimentary Rocks', definition:'From weathering, erosion, deposition, lithification. Clastic (sandstone), Chemical (limestone), Organic (coal). Features strata, fossils.', example:'Sandstone layers, fossils in limestone'},
  {id:59, chapter:'ch8', term:'Metamorphic Rocks', definition:'Existing rock altered by heat/pressure not melting. Foliated layered (slate, schist, gneiss) vs non-foliated (marble, quartzite).', example:'Limestone -> marble'},
  {id:60, chapter:'ch8', term:'Rock Cycle', definition:'Continuous: igneous -> weathering -> sediment -> sedimentary -> heat pressure -> metamorphic -> melting -> magma -> igneous. Any path possible.', example:''},
  {id:61, chapter:'ch8', term:'Plate Tectonics & Boundaries', definition:'Lithosphere plates move on asthenosphere. Evidence: Wegener continental drift. 3 boundaries: divergent (mid-ocean ridge, new crust), convergent (subduction/mountains), transform (San Andreas, earthquakes).', example:'Mid-Atlantic ridge divergent'},
  {id:62, chapter:'ch8', term:'Earthquakes & Volcanoes', definition:'Earthquake: release stress at fault, focus underground, epicenter above, P wave first fastest, S wave. Volcano types shields basaltic runny, composite explosive, cinder.', example:'Ring of Fire volcanoes convergent'},
  {id:63, chapter:'ch8', term:'Relative vs Absolute Dating', definition:'Relative: law superposition (younger on top), cross-cutting, fossils index. Absolute: radiometric using half-life isotopes.', example:'C-14 dating organic <50k years, U-238 older'},
  {id:64, chapter:'ch8', term:'Earth Structure', definition:'Crust thin (oceanic basalt dense, continental granite light), mantle convective solid flows, outer core liquid iron causes magnet, inner core solid.', example:''},

  // Ch9
  {id:65, chapter:'ch9', term:'Weathering & Erosion vs Deposition', definition:'Weathering breaks rock: mechanical (frost wedging, abrasion) chemical (acid, rust). Erosion transports (water, wind, ice, gravity). Deposition drops sediment.', example:'Grand Canyon water erosion'},
  {id:66, chapter:'ch9', term:'Soil Formation', definition:'Soil = weathered rock + organic + air water. Horizons O (organic) A (topsoil) B (subsoil) C (parent) R (bedrock). Takes 1000s years.', example:''},
  {id:67, chapter:'ch9', term:'Atmosphere Layers', definition:'Troposphere (0-12km weather, temp decreases), Stratosphere ozone, Mesosphere meteors, Thermosphere aurora ISS, Exosphere space.', example:'Ozone in stratosphere UV protection'},
  {id:68, chapter:'ch9', term:'Water Cycle', definition:'Evaporation liquid->vapor, transpiration plants, condensation vapor->liquid clouds, precipitation rain/snow, infiltration, runoff, collection.', example:''},
  {id:69, chapter:'ch9', term:'Weather vs Climate & Fronts', definition:'Weather day-to-day (temp, precip), climate long-term average 30+ years. Front: cold (steep, thunderstorms), warm (gentle, drizzle), stationary, occluded.', example:'Cold front = temp drop'},
  {id:70, chapter:'ch9', term:'Humidity, Clouds & Precipitation Types', definition:'Humidity water vapor amount, relative % saturation. Clouds: cirrus wispy high ice, stratus sheet low, cumulus puffy vertical. Rain, snow, sleet, hail.', example:'Cumulonimbus thunderstorm'},
  {id:71, chapter:'ch9', term:'Pressure Systems & Wind', definition:'High pressure cold sinking clears clockwise NH. Low pressure warm rising clouds counter-clockwise. Wind high->low, Coriolis deflects right NH creates trade/westerlies.', example:'Low = bad weather'},

let state = {
  chapter:'all',
  search:'',
  order:[],
  idx:0,
  flipped:false,
  known:Set,
  mode:'study',
  quizOptions:[],
  quizAnswered:false
};

function save(){
  localStorage.setItem('wgu165_known', JSON.stringify([...state.known]));
}
function loadKnown(){
  try{
    const arr = JSON.parse(localStorage.getItem('wgu165_known')||'[]');
    state.known = new Set(arr);
  }catch{ state.known=new Set()}
}

function getFiltered(){
  let arr = flashcards;
  if(state.chapter!=='all'){
    arr = arr.filter(c=>c.chapter===state.chapter);
  }
  if(state.search.trim()){
    const q = state.search.toLowerCase();
    arr = arr.filter(c=>c.term.toLowerCase().includes(q) || c.definition.toLowerCase().includes(q));
  }
  return arr;
}

function rebuildOrder(){
  let filtered = getFiltered();
  state.order = filtered.map(c=>c.id);
  if(state.order.length===0){ state.idx=0; render(); return; }
  // keep existing order index if possible? For simplicity reset to 0 unless preserving
  if(state.idx>=state.order.length) state.idx=0;
  render();
}

function shuffle(){
  for(let i=state.order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [state.order[i], state.order[j]]=[state.order[j], state.order[i]];
  }
  state.idx=0;
  render();
}

function currentCard(){
  if(state.order.length===0) return null;
  const id = state.order[state.idx];
  return flashcards.find(c=>c.id===id);
}

function renderChapters(){
  const container = document.getElementById('chapterList');
  container.innerHTML='';
  chapters.forEach(ch=>{
    const count = ch.id==='all'? flashcards.length : flashcards.filter(f=>f.chapter===ch.id).length;
    const btn = document.createElement('button');
    btn.className='chip'+(state.chapter===ch.id?' active':'');
    btn.innerHTML=`<span>${ch.name}</span><small>${count}</small>`;
    btn.onclick=()=>{
      state.chapter=ch.id;
      document.querySelectorAll('#chapterList .chip').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      rebuildOrder();
    };
    container.appendChild(btn);
  });
}

function renderStats(){
  const filtered = getFiltered();
  const knownCount = filtered.filter(c=>state.known.has(c.id)).length;
  document.getElementById('statTotal').textContent=filtered.length;
  document.getElementById('statKnown').textContent=knownCount;
  document.getElementById('statLeft').textContent=filtered.length-knownCount;
  const pKnown = filtered.length? (knownCount/filtered.length*100):0;
  const unknownCount = filtered.length - knownCount;
  // For simplicity unknown progress as not known? But we track unknown separate? Use 0 for unknown bar
  document.getElementById('pKnown').style.width=pKnown+'%';
  document.getElementById('pUnknown').style.width='0%';
}

function renderStudy(){
  const card = currentCard();
  const cardEl = document.getElementById('flashCard');
  if(!card){
    document.getElementById('cardTerm').textContent = 'No cards - try different search / chapter';
    document.getElementById('cardDef').textContent = '';
    document.getElementById('cardChapter').textContent='-';
    document.getElementById('cardCount').textContent='0 / 0';
    document.getElementById('quizOptions').style.display='none';
    return;
  }
  const ch = chapters.find(c=>c.id===card.chapter);
  document.getElementById('cardChapter').textContent = ch? ch.name : card.chapter;
  document.getElementById('cardCount').textContent = `${state.idx+1} / ${state.order.length}`;
  document.getElementById('cardTerm').textContent = card.term;
  document.getElementById('cardTermSmall').textContent = card.term;
  document.getElementById('cardDef').innerHTML = `${card.definition}${card.example? `<br><br><em style="color:var(--muted)">Ex: ${card.example}</em>`:''}`;
  
  // quiz
  if(state.mode==='quiz'){
    document.getElementById('quizOptions').style.display='flex';
    if(!state.quizAnswered) generateQuiz(card);
  }else{
    document.getElementById('quizOptions').style.display='none';
  }

  // known styling
  const knownBtn = document.getElementById('knownBtn');
  const unknownBtn = document.getElementById('unknownBtn');
  if(state.known.has(card.id)){
    knownBtn.classList.add('primary');
    unknownBtn.classList.remove('active');
  }else{
    knownBtn.classList.remove('primary');
  }

  // ensure not flipped unless state
  if(state.flipped){ cardEl.classList.add('flipped'); } else { cardEl.classList.remove('flipped'); }
}

function generateQuiz(card){
  const quizBox = document.getElementById('quizOptions');
  quizBox.innerHTML='';
  state.quizAnswered=false;
  // pick 3 random wrong definitions from same chapter or all
  let pool = flashcards.filter(c=>c.id!==card.id);
  if(Math.random()<0.6){
    const same = pool.filter(c=>c.chapter===card.chapter);
    if(same.length>=3) pool=same;
  }
  const shuffled = [...pool].sort(()=>Math.random()-0.5).slice(0,3);
  let options = [{def:card.definition, correct:true, card}, ...shuffled.map(c=>({def:c.definition, correct:false, card:c}))];
  options.sort(()=>Math.random()-0.5);
  options.forEach(opt=>{
    const b = document.createElement('button');
    b.className='btn';
    b.style.textAlign='left';
    b.style.justifyContent='flex-start';
    b.style.whiteSpace='normal';
    b.textContent = opt.def.slice(0,180) + (opt.def.length>180?'...':'');
    b.onclick=()=>{
      state.quizAnswered=true;
      const isCorrect = opt.correct;
      document.querySelectorAll('#quizOptions .btn').forEach(btn=>{
        btn.disabled=true;
        if(btn.textContent===b.textContent){
          btn.style.borderColor = isCorrect? 'var(--green)' : 'var(--red)';
          btn.style.background = isCorrect? 'rgba(74,222,128,0.15)' : 'rgba(248,113,113,0.15)';
        }
      });
      if(isCorrect){
        state.known.add(card.id); save();
        setTimeout(()=>{ next(); }, 800);
      }else{
        // show correct on flip
        state.flipped=true;
        renderStudy();
      }
      renderStats();
    };
    quizBox.appendChild(b);
  });
}

function renderList(){
  const grid = document.getElementById('listGrid');
  const filtered = getFiltered();
  grid.innerHTML='';
  filtered.forEach(card=>{
    const div = document.createElement('div');
    div.className='mini-card'+(state.known.has(card.id)?' known':'');
    div.innerHTML=`<div class="t">${card.term}</div><div class="d">${card.definition}</div><div style="margin-top:0.5rem;font-size:0.7rem;color:var(--muted)">${chapters.find(c=>c.id===card.chapter)?.name||''}</div>`;
    div.onclick=()=>{
      // go to study view at that card
      state.chapter='all';
      state.search='';
      document.getElementById('search').value='';
      rebuildOrder();
      const idx = state.order.indexOf(card.id);
      if(idx>=0){ state.idx=idx; state.flipped=false; state.mode='study'; switchMode('study'); render(); }
    };
    grid.appendChild(div);
  });
}

function render(){
  renderStats();
  if(state.mode==='list'){
    document.getElementById('studyView').style.display='none';
    document.getElementById('listView').style.display='block';
    renderList();
  }else{
    document.getElementById('studyView').style.display='block';
    document.getElementById('listView').style.display='none';
    renderStudy();
  }
}

function next(){
  if(state.order.length===0) return;
  state.idx = (state.idx+1) % state.order.length;
  state.flipped=false;
  render();
}
function prev(){
  if(state.order.length===0) return;
  state.idx = (state.idx-1+state.order.length) % state.order.length;
  state.flipped=false;
  render();
}
function flip(){
  state.flipped=!state.flipped;
  render();
}

function switchMode(mode){
  state.mode=mode;
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.remove('active'));
  document.querySelector(`[data-mode="${mode}"]`)?.classList.add('active');
  if(mode==='quiz'){ state.flipped=false; }
  render();
}

// events
document.getElementById('flashCard').addEventListener('click', ()=>{ 
  if(state.mode!=='list') flip(); 
});
document.getElementById('flipBtn').addEventListener('click', flip);
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('knownBtn').addEventListener('click', ()=>{
  const card=currentCard(); if(!card) return;
  state.known.add(card.id); save();
  // auto next if not at end
  next();
});
document.getElementById('unknownBtn').addEventListener('click', ()=>{
  const card=currentCard(); if(!card) return;
  state.known.delete(card.id); save();
  renderStats();
  document.getElementById('flashCard').classList.remove('flipped');
  state.flipped=false;
  // stay but visual
});

document.getElementById('shuffleBtn').addEventListener('click', shuffle);
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('Reset all known progress?')){
    state.known.clear(); save(); render();
  }
});

document.getElementById('search').addEventListener('input', (e)=>{
  state.search=e.target.value;
  rebuildOrder();
});

document.querySelectorAll('[data-mode]').forEach(btn=>{
  btn.addEventListener('click', ()=>switchMode(btn.dataset.mode));
});

document.addEventListener('keydown', (e)=>{
  if(e.code==='Space'){ e.preventDefault(); flip(); }
  if(e.code==='ArrowRight'){ next(); }
  if(e.code==='ArrowLeft'){ prev(); }
  if(e.key.toLowerCase()==='k'){ 
    const card=currentCard(); if(card){ state.known.add(card.id); save(); next(); }
  }
  if(e.key.toLowerCase()==='u'){
    const card=currentCard(); if(card){ state.known.delete(card.id); save(); render(); }
  }
  if(e.key.toLowerCase()==='s'){ shuffle(); }
});

// init
loadKnown();
renderChapters();
rebuildOrder();
</script>
